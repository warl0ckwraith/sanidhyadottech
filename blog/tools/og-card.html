<!doctype html><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#020617;color:#f1f5f9;
       font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;position:relative}
  .glow{position:absolute;width:900px;height:900px;border-radius:50%;
        background:radial-gradient(circle,rgba(176,99,224,.20) 0%,rgba(176,99,224,0) 62%);
        top:-380px;right:-260px}
  .grid{position:absolute;inset:0;opacity:.14;
        background-image:linear-gradient(rgba(176,99,224,.5) 1px,transparent 1px),
                         linear-gradient(90deg,rgba(176,99,224,.5) 1px,transparent 1px);
        background-size:56px 56px;
        -webkit-mask-image:radial-gradient(circle at 78% 12%,#000 0%,transparent 68%)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;
        justify-content:center;padding:0 92px}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:23px;letter-spacing:.28em;
          text-transform:uppercase;color:#b063e0;margin-bottom:30px}
  h1{font-size:88px;font-weight:700;letter-spacing:-.02em;line-height:1.04}
  p{font-size:35px;color:#cbd5e1;margin-top:26px;font-weight:500;line-height:1.35;max-width:19ch}
  .rule{position:absolute;left:92px;right:92px;bottom:86px;height:1px;background:rgba(203,213,225,.16)}
  .foot{position:absolute;left:92px;bottom:44px;font-family:'JetBrains Mono',monospace;
        font-size:24px;color:#cbd5e1}
  .dot{position:absolute;right:92px;bottom:40px;display:flex;gap:11px;align-items:center}
  .dot span{width:11px;height:11px;border-radius:50%;background:#b063e0;opacity:.85}
  .dot span:nth-child(2){opacity:.5}.dot span:nth-child(3){opacity:.25}
</style>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="kicker">Security Engineer</div>
  <h1>Sanidhya&nbsp;Soni</h1>
  <p>I build tools, find bugs, and write about both.</p>
</div>
<div class="rule"></div>
<div class="foot">sanidhya.tech</div>
<div class="dot"><span></span><span></span><span></span></div>
