baseURL = 'https://sanidhya.tech/'
languageCode = 'en-us'
title = 'Sanidhya Soni'
theme = 'mana'

[outputs]
  home = ["HTML", "RSS", "JSON"]  # RSS feed + search index

[pagination]
  pageSize = 10

[params]
  description = "I build and harden security systems, informed by knowing exactly how they break."
  seoTitle = "Sanidhya Soni — Security Engineer"
  ogImage = "/images/og-default.png"
  author = "Sanidhya Soni"
  favicon = "/favicon/favicon.ico"
  footerText = ""
  heroTitleLine1 = "Security"
  heroTitleLine2 = "Engineering & Research"
  
  [params.avatar]
    url = "/images/transparent-logo.png"
  
  [params.social]
    github = "https://github.com/warl0ckwraith"
    linkedin = "https://www.linkedin.com/in/sanidhyasonii"
    email = "sanidhyasonii@proton.me"

[[menus.main]]
  name = 'Work'
  pageRef = '/posts'
  weight = 10

[[menus.main]]
  name = 'Tags'
  pageRef = '/tags'
  weight = 20

[[menus.main]]
  name = 'About'
  url = '/about/'
  weight = 30

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[params.codeHighlight]
  darkTheme = "catppuccin-macchiato"
  lightTheme = "catppuccin-frappe"
